<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elevator Pitch - Emmanuel Kithusi</title>
  <meta name="description" content="Elevator pitch video page of Emmanuel Kithusi — aspiring Full Stack Data Scientist." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
  <header class="hero">
    <h1>Emmanuel Kithusi</h1>
    <p class="tagline">Aspiring Full Stack Data Scientist | Elevator Pitch</p>

    <nav aria-label="Main navigation">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="bio.html">Bio</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="elevator.html">Elevator Pitch</a></li>
      </ul>
    </nav>

    <button id="toggle-theme" aria-label="Toggle dark/light mode">🌙</button>
  </header>

  <main class="content-section">
    <section>
      <h2>Elevator Pitch</h2>
      <p>Here’s a short introduction about me and what I do. Watch the video below:</p>

      <div class="video-container" style="max-width: 800px; margin: 0 auto; border-radius: 12px; overflow: hidden;">
        <video controls width="100%" style="border-radius: 12px;">
          <source src="Elevator pitch video.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Emmanuel Kithusi. All rights reserved.</p>
    <p><a href="bio.html#contact">Contact Me</a></p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const toggleBtn = document.getElementById('toggle-theme');

      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        toggleBtn.textContent = '☀️';
      } else {
        toggleBtn.textContent = '🌙';
      }

      toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        if (document.body.classList.contains('dark-mode')) {
          localStorage.setItem('theme', 'dark');
          toggleBtn.textContent = '☀️';
        } else {
          localStorage.setItem('theme', 'light');
          toggleBtn.textContent = '🌙';
        }
      });
    });

    document.addEventListener("DOMContentLoaded", () => {
      const anchors = document.querySelectorAll("a[href]");
      anchors.forEach(anchor => {
        anchor.addEventListener("click", function (e) {
          const href = this.getAttribute("href");
          if (href && !href.startsWith("#") && !this.hasAttribute("target")) {
            e.preventDefault();
            document.body.classList.add("fade-out");
            setTimeout(() => {
              window.location.href = href;
            }, 300);
          }
        });
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      const menuToggle = document.getElementById('menu-toggle');
      const navLinks = document.querySelector('.nav-links');

      menuToggle?.addEventListener('click', () => {
        navLinks?.classList.toggle('show');
      });

      navLinks?.querySelectorAll('a')?.forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('show');
        });
      });

      const navItems = document.querySelectorAll('.nav-links a');
      window.addEventListener('scroll', () => {
        let fromTop = window.scrollY;
        navItems.forEach(link => {
          const section = document.querySelector(link.hash);
          if (
            section &&
            section.offsetTop <= fromTop + 100 &&
            section.offsetTop + section.offsetHeight > fromTop + 100
          ) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
      });
    });
  </script>
</body>
</html>
